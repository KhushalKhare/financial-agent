<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentic Finance Research Agent</title>
  <style>
    body { font-family: system-ui, Arial; background: #0b0f19; color: #e6e6e6; margin: 0; }
    .wrap { max-width: 900px; margin: 40px auto; padding: 0 16px; }
    .card { background: #121a2b; border: 1px solid #22304f; border-radius: 14px; padding: 18px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { margin: 0 0 16px; color: #b9c2d6; }
    textarea { width: 100%; min-height: 110px; border-radius: 10px; border: 1px solid #2b3c63; background: #0f1524; color: #e6e6e6; padding: 12px; font-size: 14px; }
    button { margin-top: 12px; padding: 10px 14px; border: 0; border-radius: 10px; background: #4f7cff; color: white; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .row { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
    .pill { padding: 6px 10px; border-radius: 999px; background: #0f1524; border: 1px solid #2b3c63; color: #b9c2d6; cursor: pointer; font-size: 12px; }
    pre { white-space: pre-wrap; word-wrap: break-word; background: #0f1524; border: 1px solid #2b3c63; border-radius: 12px; padding: 12px; margin-top: 16px; min-height: 140px; }
    .small { font-size: 12px; color: #7f8aa3; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Agentic Finance Research Agent</h1>
      <p>Local demo UI (Groq tool-calling + yfinance + FastAPI). Enter a prompt and hit Analyze.</p>

      <textarea id="prompt" placeholder="Example: Compare Tesla (TSLA) vs Ford (F) in simple terms."></textarea>

      <div class="row">
        <div class="pill" onclick="setPrompt('Analyze Tesla (TSLA) and give a quick snapshot.')">TSLA snapshot</div>
        <div class="pill" onclick="setPrompt('Compare Tesla (TSLA) vs Ford (F). Which looks more expensive and why?')">TSLA vs F</div>
        <div class="pill" onclick="setPrompt('Summarize Apple (AAPL) valuation and risk (beta) in simple words.')">AAPL</div>
      </div>

      <button id="btn" onclick="analyze()">Analyze</button>

      <pre id="out">Output will appear here...</pre>
      <div class="small">Tip: Screenshot this page + the terminal running uvicorn for LinkedIn.</div>
    </div>
  </div>

<script>
  function setPrompt(t){ document.getElementById('prompt').value = t; }

  async function analyze() {
    const btn = document.getElementById('btn');
    const out = document.getElementById('out');
    const prompt = document.getElementById('prompt').value.trim();

    if (!prompt) { out.textContent = "Please enter a prompt."; return; }

    btn.disabled = true;
    btn.textContent = "Analyzing...";
    out.textContent = "Working...";

    try {
      const res = await fetch("/analyze", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({prompt})
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Request failed (${res.status})`);
      }

      const data = await res.json();
      out.textContent = data.output || "(No output)";
    } catch (e) {
      out.textContent = "Error: " + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "Analyze";
    }
  }
</script>
</body>
</html>
